# /etc/nginx/conf.d/vibe-client-front.conf

server {
    listen 80;
    server_name _;

    # Front static files
    root /var/www/vibe-client-front;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Client API proxy (browser -> client server)
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: expose main admin backend static resources for avatar preview
    # If your client avatar url points to http://<host>/profile/..., keep this location enabled.
    location /profile/ {
        proxy_pass http://127.0.0.1:8080/profile/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
